openapi: 3.1.0
info:
  title: mcp-coordinator Phase 2 Auth API
  description: |
    OAuth 2.1 + RFC 8628 device flow + cookie sessions + service tokens.

    This spec covers the Phase 2 auth surface that activates when
    `COORDINATOR_OAUTH_ENABLED=true`. Phase 1 REST + MCP routes are
    documented elsewhere and are NOT in scope here.

    Originally V2 §C.13 wanted a zod-derived schema. The actual handlers
    don't use zod for request/response bodies (only for IdP response parsing
    in T05), so this spec is hand-written from the source — each operation's
    `description` cites the implementing task and source file.
  version: 0.8.0
  contact:
    name: mcp-coordinator
    url: https://github.com/swoofer/mcp-coordinator
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://{COORDINATOR_PUBLIC_URL}
    description: Self-hosted deployment
    variables:
      COORDINATOR_PUBLIC_URL:
        default: coordinator.example.com
        description: |
          Operator's public hostname (env `COORDINATOR_PUBLIC_URL`). Must be
          HTTPS in production — `__Host-` cookies refuse to set otherwise.

tags:
  - name: oauth
    description: OAuth 2.1 authorization-code flow (T15/T16/T18).
  - name: device-flow
    description: RFC 8628 device authorization grant (T17/T20).
  - name: session
    description: Cookie-session lifecycle — logout + userinfo (T23/T24).
  - name: admin
    description: Admin-only endpoints (T25 service-token issuance).
  - name: pages
    description: HTML pages — browser-facing, no JSON (T21).
  - name: ops
    description: Operability — health, metrics, discovery (T14/T36/T37).

paths:
  /auth/login:
    get:
      tags: [oauth, pages]
      summary: Initiate OAuth flow
      operationId: authLogin
      description: |
        Implemented by T15 — `src/auth/oauth-login.ts`.

        Generates a PKCE verifier + S256 challenge, creates an oauth_state
        row, sets an HMAC-bound `__Host-coordinator_oauth_state` cookie
        (V4 FIX 19), and 302-redirects to the GitHub authorize URL.

        Rate-limited 30/min per IP. Unauthenticated.
      security: []
      responses:
        '302':
          description: Redirect to GitHub authorize URL.
          headers:
            Location:
              schema:
                type: string
                format: uri
              examples:
                githubAuthorize:
                  value: https://github.com/login/oauth/authorize?client_id=Iv1.xxx&state=abc&code_challenge=zzz&code_challenge_method=S256&redirect_uri=https%3A%2F%2Fcoordinator.example.com%2Fapi%2Fauth%2Foauth%2Fcallback&scope=read%3Auser+user%3Aemail+read%3Aorg
            Set-Cookie:
              schema:
                type: string
              examples:
                stateCookie:
                  value: __Host-coordinator_oauth_state=<base64url-hmac>; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=600
        '429':
          description: Rate limit exceeded (30/min per IP).
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }
              examples:
                rateLimited:
                  value:
                    code: RATE_LIMITED
                    message: Too many login attempts
                    request_id: 01HXYZ...

  /api/auth/oauth/callback:
    get:
      tags: [oauth]
      summary: OAuth code-grant return path
      operationId: oauthCallback
      description: |
        Implemented by T16a/b/c — `src/auth/oauth-callback.ts`.

        Verifies state cookie HMAC, atomically consumes oauth_state row,
        applies mix-up defense, exchanges code at GitHub, runs login
        lockout + membership cache + allowlist + AUTO_PROVISION TX, mints
        JWT pair, sets `__Host-coordinator_session` + `__Host-coordinator_csrf`,
        302s to /auth/success.
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string }
          description: Opaque state generated by /auth/login. Required when no `error` param is present.
        - name: code
          in: query
          required: false
          schema: { type: string }
          description: GitHub authorization code. Required when no `error` param is present.
        - name: error
          in: query
          required: false
          schema: { type: string }
          description: Set by GitHub on user-denial / scope-deny (RFC 6749 §4.1.2.1).
        - name: error_description
          in: query
          required: false
          schema: { type: string }
      security: []
      responses:
        '302':
          description: |
            Successful sign-in. Sets session + CSRF cookies; clears the
            state cookie; redirects to /auth/success.
          headers:
            Location:
              schema: { type: string, format: uri }
              examples:
                success:
                  value: https://coordinator.example.com/auth/success
            Set-Cookie:
              schema: { type: string }
              description: |
                Three Set-Cookie headers: __Host-coordinator_session
                (HttpOnly), __Host-coordinator_csrf (NOT HttpOnly), and
                Max-Age=0 expiry of __Host-coordinator_oauth_state.
        '400':
          description: |
            Bad request — possible codes: OAUTH_DENIED (IdP error param),
            INVALID_REQUEST (missing state/code), INVALID_STATE (HMAC
            mismatch / cookie missing), UNKNOWN_STATE, STATE_EXPIRED,
            PROVIDER_MISMATCH (mix-up defense).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }
        '401':
          description: IdP token rejected. WWW-Authenticate Bearer header set.
          headers:
            WWW-Authenticate:
              schema: { type: string }
              examples:
                invalidToken:
                  value: Bearer realm="coordinator", error="invalid_token", error_description="IdP rejected the token"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }
        '403':
          description: |
            Allowlist miss (NOT_IN_ALLOWLIST) OR AUTO_PROVISION=false on a
            new user (USER_NOT_PROVISIONED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }
        '409':
          description: STATE_ALREADY_CONSUMED — duplicate callback.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }
        '429':
          description: LOGIN_LOCKED — too many failed login attempts.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }
        '503':
          description: IDP_UNAVAILABLE — transient IdP failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }

  /api/auth/oauth/token:
    post:
      tags: [oauth, device-flow]
      summary: RFC 6749 §6 unified token endpoint (3 grant types)
      operationId: oauthToken
      description: |
        Implemented by T18 — `src/auth/oauth-token.ts`.

        Form-encoded body dispatched on `grant_type`:
          - `authorization_code` — CLI code-grant (RFC 6749 §4.1.3).
            Exchanges code at GitHub, runs allowlist + provision + mint.
          - `refresh_token` — delegates to T19 refreshTokenGrant
            (`src/auth/refresh-rotation.ts`) with reuse-detection + grace.
          - `urn:ietf:params:oauth:grant-type:device_code` — RFC 8628 §3.4
            poll. Atomic CAS on `last_polled_at` (V4 FIX 18). Error codes:
            authorization_pending, slow_down, expired_token, access_denied,
            invalid_grant.

        All error responses use the RFC 6749 §5.2 OAuth envelope, not the
        AppError envelope.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/TokenRequestAuthorizationCode'
                - $ref: '#/components/schemas/TokenRequestRefreshToken'
                - $ref: '#/components/schemas/TokenRequestDeviceCode'
              discriminator:
                propertyName: grant_type
                mapping:
                  authorization_code: '#/components/schemas/TokenRequestAuthorizationCode'
                  refresh_token: '#/components/schemas/TokenRequestRefreshToken'
                  'urn:ietf:params:oauth:grant-type:device_code': '#/components/schemas/TokenRequestDeviceCode'
            examples:
              authCode:
                value:
                  grant_type: authorization_code
                  code: gho_abc123
                  redirect_uri: https://coordinator.example.com/cli/callback
                  code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
              refresh:
                value:
                  grant_type: refresh_token
                  refresh_token: eyJhbGciOi...
              deviceCode:
                value:
                  grant_type: urn:ietf:params:oauth:grant-type:device_code
                  device_code: 8XmHkLwQ_abc...
      responses:
        '200':
          description: Token pair issued.
          headers:
            Cache-Control:
              schema: { type: string }
              examples:
                noStore: { value: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
              examples:
                pair:
                  value:
                    access_token: eyJhbGciOi...
                    refresh_token: eyJhbGciOi...
                    token_type: Bearer
                    expires_in: 900
        '400':
          description: |
            OAuth error per RFC 6749 §5.2 / RFC 8628 §3.5. Error codes:
            invalid_request, invalid_grant, slow_down, authorization_pending,
            expired_token, access_denied, unsupported_grant_type.
          headers:
            Cache-Control:
              schema: { type: string }
              examples:
                noStore: { value: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
              examples:
                slowDown:
                  value:
                    error: slow_down
                    error_description: Polling too fast; wait 5s
                authPending:
                  value:
                    error: authorization_pending
                    error_description: Waiting for user approval
        '401':
          description: |
            invalid_grant — typically a revoked / reused refresh token, or
            an IdP token rejection during the authorization_code grant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
              examples:
                reuse:
                  value:
                    error: invalid_grant
                    error_description: Refresh token chain revoked
        '403':
          description: access_denied — user not in any allowlisted org.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '503':
          description: temporarily_unavailable — IdP unreachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }

  /api/auth/oauth/device_authorization:
    post:
      tags: [device-flow]
      summary: RFC 8628 §3.1 device flow init
      operationId: deviceAuthorization
      description: |
        Implemented by T17 — `src/auth/device-flow.ts` (handleDeviceAuthorization).

        Issues a `device_code` (256-bit base64url) + user-friendly `user_code`
        (8 chars from a 20-char unambiguous alphabet, formatted XXXX-XXXX).
        Inserts a `device_auth_requests` row with collision retry (up to 3
        attempts on UNIQUE user_code conflict).

        Rate-limited 5/min + 20/hr per IP (V4 NR11). Unauthenticated.
      security: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  description: |
                    Phase 2 accepts but does not validate (single-client
                    deployment). Phase 4 multi-client adds a registry check.
                scope:
                  type: string
                  description: |
                    Ignored in Phase 2; scope is hardcoded to
                    `read:user user:email read:org` via the GitHub provider.
              additionalProperties: false
      responses:
        '200':
          description: Device code issued (RFC 8628 §3.2 shape).
          headers:
            Cache-Control:
              schema: { type: string }
              examples:
                noStore: { value: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceCodeResponse' }
              examples:
                issued:
                  value:
                    device_code: 8XmHkLwQ-abc...
                    user_code: BCDF-GHJK
                    verification_uri: https://coordinator.example.com/auth/device
                    verification_uri_complete: https://coordinator.example.com/auth/device/confirm?user_code=BCDF-GHJK
                    expires_in: 600
                    interval: 5
        '400':
          description: INVALID_REQUEST — could not parse form body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }
        '429':
          description: RATE_LIMITED — per-min or per-hour cap hit.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }
        '500':
          description: |
            INTERNAL_ERROR — exhausted collision retries on user_code
            allocation (extremely rare given the 25.6B key space; likely
            indicates DB wedging).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }

  /auth/device/approve:
    post:
      tags: [device-flow]
      summary: Approve or deny a pending device authorization
      operationId: deviceApprove
      description: |
        Implemented by T20 — `src/auth/device-flow.ts` (handleDeviceApprove).

        Cookie-authenticated (T27 Scenario 5 — browser-only, no Bearer).
        CSRF double-submit via `__Host-coordinator_csrf` cookie + `_csrf`
        form field. Rate-limited 10/min + 20/hr per authenticated user.

        On approve: atomic CAS UPDATE on `device_auth_requests` (gates on
        not-already-resolved + not-expired + failed_approval_attempts<5);
        on success emits Tier 2 audit auth.device.approved and 302s to
        /auth/success.

        On deny: atomic UPDATE setting denied_reason='user_denied'. Always
        302s to /auth/device?status=denied (no info leak on unknown codes).

        Failed approve diagnoses the row state and either redirects to
        /auth/device with `error=invalid_code|expired|consumed|lockout`,
        or — on the 5th failed attempt — locks the row with
        denied_reason='too_many_failed_approvals' (V4 FIX 21).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [user_code, _csrf, action]
              properties:
                user_code:
                  type: string
                  description: User-facing code from the device, e.g. `BCDF-GHJK`.
                _csrf:
                  type: string
                  description: |
                    Must match the value in the `__Host-coordinator_csrf`
                    cookie (timing-safe compare).
                action:
                  type: string
                  enum: [approve, deny]
                acknowledge:
                  type: string
                  description: |
                    Confirm-checkbox value from the consent form. Not
                    semantically required server-side; the page enforces
                    `required` in markup.
      responses:
        '302':
          description: |
            Redirect. On approve success → /auth/success. On deny or any
            approve-failure diagnosis → /auth/device with status / error
            query param.
          headers:
            Location:
              schema: { type: string, format: uri }
        '400':
          description: |
            INVALID_REQUEST (missing user_code/action or unparseable body)
            or INVALID_ACTION (action ∉ {approve, deny}).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }
        '401':
          description: UNAUTHORIZED — missing or invalid session cookie.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }
        '403':
          description: CSRF_FAILED — cookie/form CSRF mismatch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }
        '429':
          description: RATE_LIMITED — per-min or per-hour cap hit.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }

  /api/auth/logout:
    post:
      tags: [session]
      summary: Local logout (revoke current family)
      operationId: logoutLocal
      description: |
        Implemented by T23 — `src/auth/logout.ts` (handleLogout).

        Revokes every unrevoked `refresh_tokens` row in the JWT's
        `family_id` and clears session + CSRF cookies. Phase 1 tokens
        lacking `family_id` get a 204 with no DB writes.
      security:
        - sessionCookie: []
        - bearerJwt: []
      responses:
        '204':
          description: Logged out. Session + CSRF cookies cleared (Max-Age=0).
          headers:
            Set-Cookie:
              schema: { type: string }
              description: |
                Two Set-Cookie headers expiring __Host-coordinator_session
                and __Host-coordinator_csrf.
        '401':
          description: UNAUTHORIZED — missing or invalid token/cookie.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }

  /api/auth/logout-all:
    post:
      tags: [session]
      summary: Global logout (bump token epoch + revoke all)
      operationId: logoutAll
      description: |
        Implemented by T23 — `src/auth/logout.ts` (handleLogoutAll).

        Bumps `users.token_epoch` so every existing JWT for the subject
        fails subsequent verification (iat < epoch). Also revokes every
        unrevoked refresh_tokens row for the user. Clears cookies.

        Rate-limited 5/hr per user.
      security:
        - sessionCookie: []
        - bearerJwt: []
      responses:
        '204':
          description: Global logout complete. Cookies cleared.
          headers:
            Set-Cookie:
              schema: { type: string }
        '401':
          description: UNAUTHORIZED.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }
        '429':
          description: RATE_LIMITED — 5/hr cap exceeded.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }

  /api/auth/revoke:
    post:
      tags: [session]
      summary: RFC 7009 token revocation
      operationId: revokeToken
      description: |
        Implemented by T23 — `src/auth/logout.ts` (handleRevoke).

        Per RFC 7009 §2.2, ALWAYS responds 200 on authenticated calls,
        regardless of whether the token existed, was already revoked, or
        is owned by another user (anti-enumeration). Audit emits only
        when a row transitions to revoked.

        Authorization: caller must own the token OR be admin. Cross-user
        revoke by a non-admin is silently no-op'd.
      security:
        - sessionCookie: []
        - bearerJwt: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: JWT (typically a refresh token) to revoke.
                token_type_hint:
                  type: string
                  description: Optional RFC 7009 hint; ignored by this implementation.
      responses:
        '200':
          description: |
            Always returned for authenticated callers per RFC 7009 §2.2,
            including for unknown / forged / cross-user tokens. Empty body.
        '401':
          description: UNAUTHORIZED — request was not authenticated at all.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }

  /api/auth/me:
    get:
      tags: [session]
      summary: Current user + org context
      operationId: userinfo
      description: |
        Implemented by T24 — `src/auth/userinfo.ts`.

        UX helper for SDKs to display "Logged in as X (org: Y)" without
        parsing the JWT. No audit emission (read-only, high-volume).

        Rate-limited 600/min per user.
      security:
        - sessionCookie: []
        - bearerJwt: []
      responses:
        '200':
          description: User + org info.
          headers:
            Cache-Control:
              schema: { type: string }
              examples:
                noStore: { value: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserinfoResponse' }
              examples:
                me:
                  value:
                    user_id: u_01HXYZ
                    email: alice@example.com
                    name: Alice Doe
                    role: admin
                    org:
                      id: o_01HABC
                      name: Acme
                    active_org_id: o_01HABC
        '401':
          description: UNAUTHORIZED.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }
        '404':
          description: |
            USER_NOT_FOUND or ORG_NOT_FOUND — defensive: token claims a
            subject/org that doesn't exist in the DB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }
        '429':
          description: RATE_LIMITED — 600/min cap exceeded.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }

  /api/admin/service-tokens:
    post:
      tags: [admin]
      summary: Issue a service-account access token (admin-only)
      operationId: issueServiceToken
      description: |
        Implemented by T25 — `src/admin/handle-service-tokens.ts`.

        Admin-only (caller's role must be `admin`). Issues a long-lived
        service-account access token bound to a target user + org. TTL
        capped at 90 days (`SERVICE_TOKEN_MAX_TTL_S`); reason must be
        ≥10 chars. Emits Tier 1 audit `auth.service_token.issued`.

        Body is JSON (not form-encoded). Bounded read: bodies > 4096 bytes
        return 400.
      security:
        - sessionCookie: []
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueServiceTokenRequest' }
            examples:
              issue:
                value:
                  user_id: u_01HXYZ
                  org_id: o_01HABC
                  scope: read
                  ttl: 30d
                  reason: ci-cd-bot-for-acme-repo
      responses:
        '200':
          description: Token issued.
          headers:
            Cache-Control:
              schema: { type: string }
              examples:
                noStore: { value: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueServiceTokenResponse' }
        '400':
          description: |
            INVALID_REQUEST (missing/typed fields or body too large),
            INVALID_TTL (bad duration format), or a ServiceTokenValidationError
            code (e.g., TTL_TOO_LARGE, REASON_TOO_SHORT, INVALID_SCOPE,
            TARGET_NOT_FOUND, CROSS_ORG_NOT_ALLOWED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }
        '401':
          description: UNAUTHORIZED.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }
        '403':
          description: FORBIDDEN — caller is authenticated but not admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }

  /auth/device:
    get:
      tags: [pages, device-flow]
      summary: User-code entry form
      operationId: devicePage
      description: |
        Implemented by T21 — `src/auth/pages/device.html.ts`.

        Static HTML form for entering a device `user_code`. Sets a fresh
        `__Host-coordinator_csrf` cookie (Max-Age=600). May render an error
        message based on `?error=invalid_code|expired|consumed|lockout`
        or `?status=denied`.
      parameters:
        - name: error
          in: query
          required: false
          schema:
            type: string
            enum: [invalid_code, expired, consumed, lockout]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [denied]
      security: []
      responses:
        '200':
          description: HTML form.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: __Host-coordinator_csrf
          content:
            text/html:
              schema: { type: string }

  /auth/device/confirm:
    get:
      tags: [pages, device-flow]
      summary: Device-authorization consent page
      operationId: deviceConfirmPage
      description: |
        Implemented by T21 — `src/auth/pages/device-confirm.html.ts`.

        Looks up the `device_auth_requests` row by `user_code` and renders
        the consent page (IP / UA / country shown so the human can verify
        provenance). Mints a per-user_code CSRF token (V3 §B-NEW-9
        phishing defense). Renders an error page on missing/invalid/
        expired/consumed codes.

        Does NOT authenticate the user — T20's POST handler does that.
      parameters:
        - name: user_code
          in: query
          required: true
          schema: { type: string }
          examples:
            ok: { value: BCDF-GHJK }
      security: []
      responses:
        '200':
          description: Consent page.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: __Host-coordinator_csrf (per-user_code random token)
          content:
            text/html:
              schema: { type: string }
        '400':
          description: |
            HTML error page for missing user_code, invalid_code, or
            expired code.
          content:
            text/html:
              schema: { type: string }
        '409':
          description: HTML error page for an already-consumed code.
          content:
            text/html:
              schema: { type: string }

  /auth/success:
    get:
      tags: [pages]
      summary: Post-sign-in landing page
      operationId: successPage
      description: |
        Implemented by T21 — `src/auth/pages/success.html.ts`.

        Static HTML "You're signed in" page reached by 302 from
        /api/auth/oauth/callback. The authenticating session cookie was
        set on callback; this page itself does no DB or auth work.
      security: []
      responses:
        '200':
          description: HTML page.
          content:
            text/html:
              schema: { type: string }

  /healthz:
    get:
      tags: [ops]
      summary: Liveness probe
      operationId: healthz
      description: |
        Implemented by T36 — `src/http/health.ts` (handleHealthz).

        Always 200 if the process is responsive. Phase 2 alias distinct
        from Phase 1's /livez (which is preserved alongside).
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthzResponse' }
              examples:
                alive:
                  value: { status: alive }

  /health/ready:
    get:
      tags: [ops]
      summary: Readiness probe (Phase 2 auth-flow-specific)
      operationId: healthReady
      description: |
        Implemented by T36 — `src/http/health.ts` (handleHealthReady).

        Returns 200/503 based on db + audit_queue + sweeper + draining
        checks. Distinct from Phase 1's /readyz (which checks db + mqtt
        + tree_sitter + git_cochange).
      security: []
      responses:
        '200':
          description: All checks green.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReadyResponse' }
              examples:
                ready:
                  value:
                    status: ready
                    checks:
                      db: { ok: true }
                      audit_queue: { ok: true, depth: 12, capacity: 10000, threshold_percent: 80 }
                      sweeper: { ok: true }
                      draining: false
        '503':
          description: One or more checks failed; same response shape.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReadyResponse' }

  /metrics/auth:
    get:
      tags: [ops]
      summary: Prometheus auth metrics scrape
      operationId: metricsAuth
      description: |
        Implemented by T37 — `src/http/metrics.ts`.

        Returns the Phase 2 metric registry in Prometheus text-exposition
        format. Distinct from Phase 1's /metrics (separate registries).

        Access control: loopback IPs allowed by default; optionally a
        Bearer token can grant access from any IP (constant-time compare).
      security:
        - {}
        - bearerJwt: []
      responses:
        '200':
          description: Prometheus exposition.
          content:
            text/plain:
              schema: { type: string }
              examples:
                metrics:
                  value: |
                    # HELP coordinator_auth_login_attempts_total Total /auth/login requests
                    # TYPE coordinator_auth_login_attempts_total counter
                    coordinator_auth_login_attempts_total 42
        '403':
          description: FORBIDDEN — not loopback and no/invalid bearer token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppError' }

  /.well-known/oauth-authorization-server:
    get:
      tags: [ops, oauth]
      summary: RFC 8414 discovery document
      operationId: discovery
      description: |
        Implemented by T14 — `src/discovery.ts`.

        Returns the RFC 8414 OAuth 2.0 Authorization Server Metadata
        document. Cached publicly for 24h (Cache-Control: public, max-age=86400).
      security: []
      responses:
        '200':
          description: Discovery document.
          headers:
            Cache-Control:
              schema: { type: string }
              examples:
                pub24h:
                  value: "public, max-age=86400"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryDoc' }
              examples:
                doc:
                  value:
                    issuer: https://coordinator.example.com
                    authorization_endpoint: https://coordinator.example.com/auth/login
                    token_endpoint: https://coordinator.example.com/api/auth/oauth/token
                    device_authorization_endpoint: https://coordinator.example.com/api/auth/oauth/device_authorization
                    revocation_endpoint: https://coordinator.example.com/api/auth/revoke
                    userinfo_endpoint: https://coordinator.example.com/api/auth/me
                    grant_types_supported:
                      - authorization_code
                      - refresh_token
                      - urn:ietf:params:oauth:grant-type:device_code
                    response_types_supported: [code]
                    code_challenge_methods_supported: [S256]
                    token_endpoint_auth_methods_supported: [none]
                    revocation_endpoint_auth_methods_supported: [none]
                    service_documentation: https://coordinator.example.com/docs/oauth-setup
                    id_token_signing_alg_values_supported: [HS256]

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-coordinator_session
      description: |
        HttpOnly session JWT set by /api/auth/oauth/callback (T16c).
        Paired with `__Host-coordinator_csrf` (NOT HttpOnly) for
        double-submit CSRF protection on form-bound POSTs (T27 Scenario 5).
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Phase 1 Bearer token OR Phase 2 service-account JWT
        (Authorization: Bearer <jwt>).

  schemas:
    AppError:
      type: object
      description: Coordinator app-error envelope, returned from non-OAuth endpoints.
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: SCREAMING_SNAKE_CASE error code.
          examples: [RATE_LIMITED, UNAUTHORIZED, CSRF_FAILED, NOT_IN_ALLOWLIST]
        message:
          type: string
          description: Human-readable description.
        request_id:
          type: [string, 'null']
          description: T10 request id; null when called outside withRequestId.
        details:
          type: object
          additionalProperties: true
          description: Optional structured context (omitted when empty).

    OAuthError:
      type: object
      description: RFC 6749 §5.2 / RFC 8628 §3.5 OAuth error envelope.
      required: [error]
      properties:
        error:
          type: string
          description: |
            Standardized OAuth/device-flow error code.
          examples:
            - invalid_request
            - invalid_grant
            - slow_down
            - authorization_pending
            - expired_token
            - access_denied
            - unsupported_grant_type
            - temporarily_unavailable
        error_description:
          type: string
        error_uri:
          type: string
          format: uri

    TokenRequestAuthorizationCode:
      type: object
      required: [grant_type, code, redirect_uri]
      properties:
        grant_type:
          type: string
          const: authorization_code
        code:
          type: string
        redirect_uri:
          type: string
          format: uri
        code_verifier:
          type: string
          description: PKCE verifier (REQUIRED when /auth/login was used, optional only for CLI-self-driven flows).

    TokenRequestRefreshToken:
      type: object
      required: [grant_type, refresh_token]
      properties:
        grant_type:
          type: string
          const: refresh_token
        refresh_token:
          type: string

    TokenRequestDeviceCode:
      type: object
      required: [grant_type, device_code]
      properties:
        grant_type:
          type: string
          const: urn:ietf:params:oauth:grant-type:device_code
        device_code:
          type: string

    TokenResponse:
      type: object
      description: RFC 6749 §5.1 successful token response.
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Short-lived JWT (default 15min TTL).
        refresh_token:
          type: string
          description: Long-lived JWT in a rotation family.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Lifetime of the access_token in seconds.

    DeviceCodeResponse:
      type: object
      description: RFC 8628 §3.2 device authorization response.
      required:
        - device_code
        - user_code
        - verification_uri
        - verification_uri_complete
        - expires_in
        - interval
      properties:
        device_code:
          type: string
          description: 256-bit base64url; opaque to the user.
        user_code:
          type: string
          description: 8 chars from 20-char unambiguous alphabet, XXXX-XXXX formatted.
        verification_uri:
          type: string
          format: uri
        verification_uri_complete:
          type: string
          format: uri
          description: Prefilled with user_code for nicer UX.
        expires_in:
          type: integer
          examples: [600]
        interval:
          type: integer
          examples: [5]

    UserinfoResponse:
      type: object
      required: [user_id, email, role, org, active_org_id]
      properties:
        user_id:
          type: string
        email:
          type: string
          format: email
        name:
          type: [string, 'null']
        role:
          type: string
          enum: [admin, member, service]
        org:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        active_org_id:
          type: string
          description: Alias of `org.id` for Phase 5 multi-org forward-compat.

    IssueServiceTokenRequest:
      type: object
      required: [user_id, org_id, scope, ttl, reason]
      properties:
        user_id:
          type: string
          description: Target user the service token will act as.
        org_id:
          type: string
          description: Target org. Must match the target user's primary_org_id (cross-org issuance is rejected).
        scope:
          type: string
          enum: [read, write, admin]
        ttl:
          type: string
          description: Duration in the form `Ns`, `Nm`, `Nh`, or `Nd`. Capped at 90d.
          examples: [30d, 1h, 600s]
        reason:
          type: string
          minLength: 10
          description: Audit context; recorded in `auth.service_token.issued`.

    IssueServiceTokenResponse:
      type: object
      required: [jti, access_token, expires_at]
      properties:
        jti:
          type: string
          description: Token id (matches the JWT's jti claim).
        access_token:
          type: string
          description: Service-account JWT. Treat as a credential.
        expires_at:
          type: string
          format: date-time

    HealthzResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: alive

    HealthReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          required: [db, audit_queue, sweeper, draining]
          properties:
            db:
              type: object
              required: [ok]
              properties:
                ok: { type: boolean }
                error: { type: string }
            audit_queue:
              type: object
              required: [ok, depth, capacity, threshold_percent]
              properties:
                ok: { type: boolean }
                depth: { type: integer }
                capacity: { type: integer }
                threshold_percent: { type: integer }
            sweeper:
              type: object
              required: [ok]
              properties:
                ok: { type: boolean }
            draining:
              type: boolean

    DiscoveryDoc:
      type: object
      description: RFC 8414 OAuth 2.0 Authorization Server Metadata.
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - device_authorization_endpoint
        - revocation_endpoint
        - userinfo_endpoint
        - grant_types_supported
        - response_types_supported
        - code_challenge_methods_supported
      properties:
        issuer:
          type: string
          format: uri
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        device_authorization_endpoint:
          type: string
          format: uri
        revocation_endpoint:
          type: string
          format: uri
        userinfo_endpoint:
          type: string
          format: uri
        grant_types_supported:
          type: array
          items: { type: string }
        response_types_supported:
          type: array
          items: { type: string }
        code_challenge_methods_supported:
          type: array
          items: { type: string }
        token_endpoint_auth_methods_supported:
          type: array
          items: { type: string }
        revocation_endpoint_auth_methods_supported:
          type: array
          items: { type: string }
        service_documentation:
          type: string
          format: uri
        id_token_signing_alg_values_supported:
          type: array
          items: { type: string }
