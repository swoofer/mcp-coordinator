version: 2
updates:
  # Dependabot has no dedicated "pnpm" ecosystem — the "npm" ecosystem
  # reads pnpm-lock.yaml (and npm/yarn lockfiles) at the given directory.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      # cookie v2 is ESM-only (Node 22+) and renamed its API
      # (parse/serialize -> parseCookie/stringifyCookie). Migrating is a
      # deliberate, code-touching change on security-sensitive cookie
      # handling, not an automated bump. Hold at v1 until we choose to move.
      - dependency-name: "cookie"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
