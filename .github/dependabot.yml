version: 2
updates:
  # Dependabot has no dedicated "pnpm" ecosystem — the "npm" ecosystem
  # reads pnpm-lock.yaml (and npm/yarn lockfiles) at the given directory.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
