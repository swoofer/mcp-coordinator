name: Docker publish

on:
  push:
    tags: ["v*"]
  # Manual lever — useful if a tag was already pushed but the registry
  # publish needs a retry (transient GHCR auth failure, etc.).
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build from (e.g. v0.10.9)"
        required: true
        type: string
      promote_latest:
        description: "Also move :latest to this tag. Leave off when retrying an OLD release — it would shift :latest backwards."
        required: false
        default: false
        type: boolean
  # Called from release.yml after release-please tags + npm publish
  # complete, so the GHCR push runs in the same workflow run as the
  # release. (GitHub's anti-recursive policy means a tag push from
  # GITHUB_TOKEN does NOT trigger the `push: tags` path above — without
  # this hook the Docker image would only update on manual dispatch.)
  workflow_call:
    inputs:
      tag:
        description: "Git tag to build from"
        required: true
        type: string
      promote_latest:
        description: "Also move :latest to this tag. release.yml passes true — its docker job is gated on release_created, so the tag is always the newest one."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  # Don't cancel in progress — a partial registry push is worse than a
  # second concurrent push that no-ops on already-pushed layers.
  group: docker-publish-${{ github.ref }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up QEMU (for cross-arch emulation)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/metadata-action's semver matchers read `github.ref` — which
      # is `refs/tags/vX.Y.Z` only on a direct tag push. workflow_dispatch
      # and workflow_call both run with the caller's `github.ref` (typically
      # `refs/heads/main`), so the semver matchers don't fire in those
      # cases. The `type=match` directives below take the version from
      # `inputs.tag` instead, which is set in both event types.
      #
      # Gate: when `inputs.tag` is set, we're in workflow_dispatch or
      # workflow_call. Don't gate on `github.event_name` — for reusable
      # workflows, that value reflects the CALLER's event (typically
      # `push`), not `workflow_call`. Asking the input directly is the
      # only reliable signal.
      #
      # `:latest` promotion — see the `promote_latest` input.
      #
      # This gate used to be `github.event_name == 'push' && startsWith(
      # github.ref, 'refs/tags/v')` alone, on the assumption that ":latest
      # still updates on real tag pushes". There ARE no real tag pushes: a
      # tag pushed by release-please's GITHUB_TOKEN does not trigger the
      # `push: tags` path above (the very anti-recursion policy that made
      # the workflow_call hook necessary). So the only path that ever runs
      # on a release could never promote `:latest`, and it silently sat on
      # v0.13.0 — the last release published while a tag-push path still
      # existed — for nine releases, through v2.0.0.
      #
      # The backwards-shift concern behind the old gate is real but applies
      # only to the manual retry path, so it stays opt-in there. The chained
      # `docker:` job in release.yml is gated on `release_created == 'true'`,
      # which makes its `inputs.tag` structurally the newest tag, so it
      # passes promote_latest: true.
      #
      # Written as `a || b` rather than `a == true`: GitHub coerces mixed-type
      # `==` operands to numbers, so a string 'true' would compare false. The
      # `||` form is truthy-correct whether the input arrives as a boolean or
      # a string, and yields the untouched `b` when inputs are absent
      # entirely (the push-tag path, where the `inputs` context is empty).
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # metadata-action's default flavor (`latest=auto`) adds `:latest`
          # on its own semver heuristics, short-circuiting the explicit
          # `type=raw,value=latest,enable=...` gate below. Disable the
          # implicit behavior so the gated line is the ONLY source of
          # `:latest`.
          flavor: |
            latest=false
          # Order matters, and `latest` MUST stay last. metadata-action takes
          # `version.main` — and with it the org.opencontainers.image.version
          # label — from the FIRST enabled entry. On the workflow_call path
          # github.ref is refs/heads/main, so both semver matchers are inert;
          # a leading raw `latest` would win and label every release image
          # `version=latest` instead of the real version. Order does not change
          # the pushed tag set (main + all partials are pushed either way).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=match,pattern=v(\d+\.\d+\.\d+),group=1,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=match,pattern=v(\d+\.\d+),group=1,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable=${{ inputs.promote_latest || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache backend — speeds up the second arch by
          # ~3-5min after the first one warms it. Scoped per workflow.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance attestation: GHCR shows the build came from this
          # workflow on this repo. Same posture as npm publish provenance.
          provenance: true
          sbom: true
