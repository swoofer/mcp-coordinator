name: Docker publish

on:
  push:
    tags: ["v*"]
  # Manual lever — useful if a tag was already pushed but the registry
  # publish needs a retry (transient GHCR auth failure, etc.).
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build from (e.g. v0.10.9)"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  # Don't cancel in progress — a partial registry push is worse than a
  # second concurrent push that no-ops on already-pushed layers.
  group: docker-publish-${{ github.ref }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up QEMU (for cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/metadata-action's semver matchers read `github.ref` — which
      # is `refs/tags/vX.Y.Z` on tag push but `refs/heads/main` on
      # workflow_dispatch (the `tag` input only affects checkout, not the
      # metadata-action's view of the build context). The `type=match`
      # directives below let us pass the version via the `value` parameter,
      # so manual dispatch produces the same tag set as a real tag push.
      #
      # `:latest` is intentionally NOT promoted on workflow_dispatch — that
      # protects against accidentally shifting :latest backwards when
      # retrying a publish of an older release.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
            type=match,pattern=v(\d+\.\d+\.\d+),group=1,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=match,pattern=v(\d+\.\d+),group=1,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache backend — speeds up the second arch by
          # ~3-5min after the first one warms it. Scoped per workflow.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance attestation: GHCR shows the build came from this
          # workflow on this repo. Same posture as npm publish provenance.
          provenance: true
          sbom: true
