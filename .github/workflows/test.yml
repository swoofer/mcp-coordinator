name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:ci

      - run: pnpm build

  # sdk/ has its own npm-managed package (own lockfile, vitest runner) —
  # it's not part of the pnpm workspace test suite above, so it needs its
  # own install+test steps. engines >=20, so run it on the same floor as
  # the main matrix's low end.
  sdk-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - run: npm ci
        working-directory: sdk

      - run: npm test
        working-directory: sdk

  # Smoke test: a fresh contributor without native build tools (no Rust
  # toolchain, no python-distutils) must still be able to `pnpm build`.
  # This only confirms the sources still type-check/transpile without
  # native tooling present (tsc never executes import/require at runtime),
  # so it does not catch a hard runtime dependency on an optionalDependency
  # like `tree-sitter` — only that such code still compiles.
  build-no-native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm build
