name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Skip release-please and just publish to npm from main HEAD"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Surface release-please outputs to the docker job below so it can decide
    # whether a release was actually cut and which tag to push to GHCR.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071  # v4
        id: release
        if: ${{ github.event_name == 'push' || inputs.publish_only != 'true' }}
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        if: ${{ steps.release.outputs.release_created || inputs.publish_only == 'true' }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        if: ${{ steps.release.outputs.release_created || inputs.publish_only == 'true' }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        if: ${{ steps.release.outputs.release_created || inputs.publish_only == 'true' }}
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
        if: ${{ steps.release.outputs.release_created || inputs.publish_only == 'true' }}

      - run: pnpm build
        if: ${{ steps.release.outputs.release_created || inputs.publish_only == 'true' }}

      # `--no-git-checks` skips pnpm's pre-publish branch+clean checks
      # (we don't need them — release-please already produced the release
      # commit and CI is the canonical place to publish from).
      - run: pnpm publish --no-git-checks --provenance
        if: ${{ steps.release.outputs.release_created || inputs.publish_only == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Chained Docker publish on every release-please cut. A tag push from
  # release-please's GITHUB_TOKEN does NOT trigger docker-publish.yml's
  # `push: tags` event (GitHub anti-recursive workflow policy). Calling
  # docker-publish.yml as a reusable workflow runs it in the same overall
  # run as `release`, so no token gymnastics are needed.
  #
  # Gated on `release_created` so this is a no-op on every push that
  # ONLY moves the release-please tracking PR — we only build+push when
  # there's a real release.
  docker:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ needs.release.outputs.tag_name }}

  # Chained binary release on every release-please cut. Same anti-recursive
  # rationale as `docker` above: a tag push from release-please's
  # GITHUB_TOKEN does NOT trigger release-binaries.yml's `push: tags` event,
  # so without this hook no binaries get attached to the GitHub release.
  binaries:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ needs.release.outputs.tag_name }}
