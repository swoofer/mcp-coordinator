name: Release binaries

on:
  push:
    tags: ["v*"]
  # Validate the binary build (compile + verify, no publish) on PRs that touch
  # build-affecting files, so release-time-only failures (e.g. a native module
  # bun --compile can't embed) are caught before a release, not during one.
  pull_request:
    paths:
      - ".github/workflows/release-binaries.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "src/tree-sitter-extractor.ts"
  # Called from release.yml after release-please tags + npm/Docker publish
  # complete, so the binary build runs in the same workflow run as the
  # release. (GitHub's anti-recursive policy means a tag push from
  # GITHUB_TOKEN does NOT trigger the `push: tags` path above — without
  # this hook, binaries would never be built for release-please cuts.)
  workflow_call:
    inputs:
      tag:
        description: "Git tag to build from"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: macos-15
            platform: darwin
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          # workflow_call/dispatch pass an explicit tag; for push:tags and
          # pull_request, leave ref empty so checkout uses its default (the
          # pushed tag, or the PR merge ref — `github.ref_name` would be the
          # invalid `NN/merge` on pull_request and break the checkout).
          ref: ${{ inputs.tag || '' }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: Build binary
        run: |
          mkdir -p bin
          # tree-sitter + its grammar packages are OPTIONAL native modules,
          # loaded via dynamic import with graceful fallback
          # (src/tree-sitter-extractor.ts). `bun build --compile` cannot embed
          # their native .node prebuilds into the single-file executable
          # (it fails resolving e.g. ./prebuilds/darwin-arm64/tree-sitter.node),
          # so mark them external — the compiled binary degrades gracefully
          # without the optional code-analysis grammars.
          EXTERNAL="--external tree-sitter"
          for g in typescript javascript python go rust java c-sharp c cpp ruby php kotlin swift bash; do
            EXTERNAL="$EXTERNAL --external tree-sitter-$g"
          done
          bun build --compile cli/index.ts --outfile bin/mcp-coordinator $EXTERNAL

      - name: Sign binary (macOS)
        if: matrix.platform == 'darwin'
        run: |
          codesign --remove-signature bin/mcp-coordinator || true
          codesign --sign - --force --entitlements /dev/stdin bin/mcp-coordinator << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Verify binary
        run: |
          ./bin/mcp-coordinator --version
          ./bin/mcp-coordinator server --help

      - name: Package tarball
        if: github.event_name != 'pull_request'
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          DIST_NAME="mcp-coordinator-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "dist/${DIST_NAME}/dashboard"

          cp bin/mcp-coordinator "dist/${DIST_NAME}/"
          cp package.json "dist/${DIST_NAME}/"
          cp -r dashboard/public "dist/${DIST_NAME}/dashboard/"

          cd dist
          tar czf "${DIST_NAME}.tar.gz" "${DIST_NAME}"

      - name: Publish tarball to GH Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
