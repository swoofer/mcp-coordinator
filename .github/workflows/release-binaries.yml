name: Release binaries

on:
  push:
    tags: ["v*"]
  # Called from release.yml after release-please tags + npm/Docker publish
  # complete, so the binary build runs in the same workflow run as the
  # release. (GitHub's anti-recursive policy means a tag push from
  # GITHUB_TOKEN does NOT trigger the `push: tags` path above — without
  # this hook, binaries would never be built for release-please cuts.)
  workflow_call:
    inputs:
      tag:
        description: "Git tag to build from"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
            bun_target: bun-darwin-aarch64
          - os: macos-15
            platform: darwin
            arch: x64
            bun_target: bun-darwin-x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            bun_target: bun-linux-x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: Build binary
        run: |
          mkdir -p bin
          bun build --compile cli/index.ts --outfile bin/mcp-coordinator

      - name: Sign binary (macOS)
        if: matrix.platform == 'darwin'
        run: |
          codesign --remove-signature bin/mcp-coordinator || true
          codesign --sign - --force --entitlements /dev/stdin bin/mcp-coordinator << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Verify binary
        run: |
          ./bin/mcp-coordinator --version
          ./bin/mcp-coordinator server --help

      - name: Package tarball
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          DIST_NAME="mcp-coordinator-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "dist/${DIST_NAME}/dashboard"

          cp bin/mcp-coordinator "dist/${DIST_NAME}/"
          cp package.json "dist/${DIST_NAME}/"
          cp -r dashboard/public "dist/${DIST_NAME}/dashboard/"

          cd dist
          tar czf "${DIST_NAME}.tar.gz" "${DIST_NAME}"

      - name: Publish tarball to GH Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
