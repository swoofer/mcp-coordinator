name: E2E

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # --with-deps installs the Linux system libs Chromium needs (fonts,
      # libnss, libdrm, etc.) so the headless browser actually launches.
      - run: npx playwright install --with-deps chromium

      - run: npx playwright test
        env:
          CI: "true"

      # Persist HTML report on failure so we can inspect the trace.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
