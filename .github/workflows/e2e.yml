name: E2E

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # --with-deps installs the Linux system libs Chromium needs (fonts,
      # libnss, libdrm, etc.) so the headless browser actually launches.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm exec playwright test
        env:
          CI: "true"

      # Persist HTML report on failure so we can inspect the trace.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
