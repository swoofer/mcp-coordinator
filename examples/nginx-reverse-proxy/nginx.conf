server {
    listen 443 ssl http2;
    server_name coordinator.example.com;

    # TLS -- replace with your cert paths
    ssl_certificate     /etc/nginx/certs/coordinator.crt;
    ssl_certificate_key /etc/nginx/certs/coordinator.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    # Pass-through for OAuth + REST + MCP HTTP
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for SSE (text/event-stream)
        proxy_buffering          off;
        proxy_read_timeout       1d;
        proxy_send_timeout       1d;

        # Pass cookies through (__Host-coordinator_session etc.)
        proxy_cookie_path        / /;
        proxy_pass_request_headers on;
    }

    # WebSocket upgrade (MQTT bridge over WS)
    location /mqtt {
        proxy_pass http://127.0.0.1:3000/mqtt;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 1d;
    }
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name coordinator.example.com;
    return 301 https://$host$request_uri;
}
