version: "3.9"

services:
  coordinator:
    # Published from this repo's main on every release tag — see
    # .github/workflows/docker-publish.yml. Multi-arch (linux/amd64 +
    # linux/arm64). Pinned to an exact version so this example is
    # reproducible — bump the tag when you upgrade. Alternatives:
    #   :0.13        — auto-bumps within the 0.13.x series
    #   :latest      — always the most recent release (not advised in prod)
    image: ghcr.io/swoofer/mcp-coordinator:0.13.0
    env_file: .env
    volumes:
      - coordinator-data:/data
    networks: [internal]
    restart: unless-stopped
    # The Dockerfile already defines a HEALTHCHECK against :3100/health;
    # compose will pick it up automatically. Override here only if you
    # remap the internal port.

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    depends_on: [coordinator]
    restart: unless-stopped

volumes:
  coordinator-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
